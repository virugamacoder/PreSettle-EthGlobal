# Runs on the EC2 server from APP_DIR (the deploy workflow copies this file there).
# APP_DIR contains: .env (from BACKEND_ENV_FILE), nginx/nginx.conf, nginx/certs/{cert.pem,private.key}
# The compose project name is the APP_DIR folder name, so deploying to the same
# APP_DIR replaces the previous containers instead of starting a second set.

services:
  app:
    image: ${DOCKER_IMAGE:?set DOCKER_IMAGE in .env}
    env_file: .env
    init: true
    restart: unless-stopped
    expose:
      - "3000"
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    logging:
      driver: json-file
      options: { max-size: "5m", max-file: "3" }
