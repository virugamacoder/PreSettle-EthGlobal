# HTTPS reverse proxy in front of the Node app.
# Certificate files are written to APP_DIR/nginx/certs by the deploy workflow
# (Let's Encrypt certificate for <server-ip>.nip.io).

upstream backend {
  server app:3000;
  keepalive 16;
}

# Port 80: Let's Encrypt HTTP challenge, everything else goes to HTTPS.
server {
  listen 80 default_server;
  server_name _;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl default_server;
  http2 on;
  server_name _;

  ssl_certificate     /etc/nginx/certs/cert.pem;
  ssl_certificate_key /etc/nginx/certs/private.key;
  ssl_protocols       TLSv1.2 TLSv1.3;
  ssl_session_cache   shared:TLS:10m;
  ssl_session_timeout 1h;

  add_header Strict-Transport-Security "max-age=31536000" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "no-referrer" always;

  client_max_body_size 1m;
  gzip on;
  gzip_types application/json text/plain;

  location / {
    proxy_pass http://backend;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }
}
