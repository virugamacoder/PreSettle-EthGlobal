# Deploy the backend to the AWS EC2 server.
#
# Runs on push to main when backend/** changes (or manually).
# Flow: build Docker image -> push to Docker Hub -> SSH to EC2 -> docker compose up.
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   DOCKER_HUB_USERNAME, DOCKER_HUB_TOKEN   Docker Hub login
#   SERVER_HOST, SERVER_USER, SERVER_PORT    EC2 address, SSH user, SSH port
#   SERVER_SSH_KEY                           full content of the EC2 .pem key
#   APP_DIR                                  deploy folder on the server
#   CERTBOT_EMAIL                            email for the Let's Encrypt certificate
#   BACKEND_ENV_FILE                         the whole backend .env file (multi-line)

name: Deploy Backend

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

concurrency:
  group: deploy-backend
  cancel-in-progress: false

env:
  IMAGE: ${{ secrets.DOCKER_HUB_USERNAME }}/pre-settle-backend

jobs:
  build:
    name: Build and push image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      - uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Write .env and make sure the certificate exists
        uses: appleboy/ssh-action@v1.0.3
        env:
          BACKEND_ENV_FILE: ${{ secrets.BACKEND_ENV_FILE }}
          APP_DIR: ${{ secrets.APP_DIR }}
          DOMAIN: ${{ secrets.SERVER_HOST }}.nip.io
          CERTBOT_EMAIL: ${{ secrets.CERTBOT_EMAIL }}
          IMAGE_LATEST: ${{ secrets.DOCKER_HUB_USERNAME }}/pre-settle-backend:latest
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          envs: BACKEND_ENV_FILE,APP_DIR,DOMAIN,CERTBOT_EMAIL,IMAGE_LATEST
          command_timeout: 5m
          script: |
            set -e
            mkdir -p "$APP_DIR/nginx/certs"

            # .env from the BACKEND_ENV_FILE secret + the image docker-compose should run
            printf '%s\n' "$BACKEND_ENV_FILE" > "$APP_DIR/.env"
            printf 'DOCKER_IMAGE=%s\n' "$IMAGE_LATEST" >> "$APP_DIR/.env"
            chmod 600 "$APP_DIR/.env"
            echo "[ok] .env keys:"; cut -d= -f1 "$APP_DIR/.env" | grep -v '^#' | grep -v '^$'

            # Let's Encrypt certificate for <ip>.nip.io (skipped if valid for 7+ more days)
            LIVE="/etc/letsencrypt/live/$DOMAIN/fullchain.pem"
            if sudo test -f "$LIVE" && sudo openssl x509 -checkend 604800 -noout -in "$LIVE"; then
              echo "[ok] certificate for $DOMAIN is valid"
            else
              command -v certbot >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq certbot)
              (cd "$APP_DIR" && docker compose stop nginx) 2>/dev/null || true
              sudo certbot certonly --standalone --non-interactive --agree-tos -m "$CERTBOT_EMAIL" -d "$DOMAIN"
            fi
            sudo cp "/etc/letsencrypt/live/$DOMAIN/fullchain.pem" "$APP_DIR/nginx/certs/cert.pem"
            sudo cp "/etc/letsencrypt/live/$DOMAIN/privkey.pem"   "$APP_DIR/nginx/certs/private.key"
            sudo chown "$USER:$USER" "$APP_DIR/nginx/certs/"*
            chmod 644 "$APP_DIR/nginx/certs/cert.pem"; chmod 600 "$APP_DIR/nginx/certs/private.key"

      - name: Copy docker-compose and nginx config
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          source: "backend/docker-compose.yml,backend/nginx/nginx.conf"
          target: ${{ secrets.APP_DIR }}
          strip_components: 1

      - name: Start containers
        uses: appleboy/ssh-action@v1.0.3
        env:
          APP_DIR: ${{ secrets.APP_DIR }}
          DH_USER: ${{ secrets.DOCKER_HUB_USERNAME }}
          DH_TOKEN: ${{ secrets.DOCKER_HUB_TOKEN }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          envs: APP_DIR,DH_USER,DH_TOKEN
          script: |
            set -e
            cd "$APP_DIR"
            echo "$DH_TOKEN" | docker login -u "$DH_USER" --password-stdin
            docker compose pull app
            docker compose up -d --remove-orphans
            docker compose restart nginx
            docker image prune -f
            docker compose ps

      - name: Health check
        uses: appleboy/ssh-action@v1.0.3
        env:
          APP_DIR: ${{ secrets.APP_DIR }}
          DOMAIN: ${{ secrets.SERVER_HOST }}.nip.io
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          envs: APP_DIR,DOMAIN
          script: |
            for i in $(seq 1 12); do
              if curl -s --max-time 5 "https://$DOMAIN/health" | grep -q '"status":"ok"'; then
                echo "[ok] https://$DOMAIN is live"; exit 0
              fi
              echo "waiting ($i/12)..."; sleep 5
            done
            echo "[fail] health check failed"
            cd "$APP_DIR" && docker compose logs --tail=50 app
            exit 1
